<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="body">
    <header class="header">
      <img src="./eisenhower-matrix.jpg" class="header__image" alt="the eisenhower-matrix picture">
      <a href="https://goal-life.com/page/method/matrix-eisenhower" class="header__link" >Want more details?</a>
		</header>
    <main class="main">
      <section id="addToList" class="top-section">
        <label for="new-task" class="top-section__label">Add Item</label>
        <div class="top-section__wrapper">
          <input id="new-task" class="top-section__input" type="text">
          <button class="top-section__button">Add</button>
        </div>
      </section>
        <section class="todo-section">
					<h1 class="todo-section__title">Todo</h1>
					<ul id="incompleteTasks" class="todo-section__list">
						<li class="todo-section__task task">
							<input type="checkbox" class="task__checkbox">
							<label class="task__label task__input">Pay Bills</label>
							<input type="text" class="task__input">
							<button class="task__edit">Edit</button>
							<button class="task__delete">
								<img src="./remove.svg" class="task__image" alt="remove icon">
							</button>
						</li>
						<li class="todo-section__task task task__editing">
							<input type="checkbox" class="task__checkbox">
							<label class="task__label task__input">Go Shopping</label>
							<input type="text" value="Go Shopping" class="task__input">
							<button class="task__edit">Save</button>
							<button class="task__delete">
								<img src="./remove.svg" class="task__image" alt="remove icon">
							</button>
						</li>
					</ul>
				</section>
        <section class="complete-section">
					<h2 class="complete-section__title">Completed</h2>
					<ul id="completed-tasks" class="complete-section__list">
						<li class="complete-section__task task">
							<input type="checkbox" class="task__checkbox" checked>
							<label class="task__input task__label">See the Doctor</label>
							<input type="text" class="task__input">
							<button class="task__edit">Edit</button>
							<button class="task__delete">
								<img src="./remove.svg" class="task__image" alt="remove icon">
							</button>
						</li>
					</ul>
				</section>
      </main>
    <script src="app.js"></script>
  </body>
</html>
